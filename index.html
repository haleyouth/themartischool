<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1b79c0" />

    <title>The Marti School | Turkish Weekend School in Maryland</title>
    <meta
      name="description"
      content="A Saturday school in Columbia, Maryland where children learn Turkish, celebrate their culture, and make friends. Classes grouped by ability. Enrolling now."
    />

    <!-- The hero art is the largest paint, so start it before the CSS parses. -->
    <link rel="preload" as="image" href="/hero.webp" imagesrcset="/hero-600.webp 600w, /hero.webp 1200w" imagesizes="(max-width: 1024px) 90vw, 560px" />

    <!-- Official MARTI mark, square-cropped for tabs, from themarti.org. -->
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />

    <!-- Open Graph, so a shared link renders properly in messages and socials. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="The Marti School" />
    <meta property="og:title" content="The Marti School | Turkish Weekend School in Maryland" />
    <meta
      property="og:description"
      content="A Saturday school where Turkish-American children build fluency in Turkish and grow up connected to their heritage."
    />
    <meta property="og:url" content="https://themartischool.web.app" />
    <meta property="og:image" content="https://themartischool.web.app/marti-logo.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
